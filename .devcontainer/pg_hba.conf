# Administrator access only through the database container's local socket.
local   all   postgres                         trust

# Reject all other local socket users.
local   all   all                              reject

# Rails may authenticate only as its restricted application role.
host    all   citewise_app   0.0.0.0/0          scram-sha-256
host    all   citewise_app   ::/0               scram-sha-256

# Reject all other TCP connections, including postgres administrator logins.
host    all   all            0.0.0.0/0          reject
host    all   all            ::/0               reject
