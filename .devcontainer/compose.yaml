name: "citewise"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    # Dev server for the host browser when using the devcontainer CLI (no VS Code
    # port forwarding). Loopback only; bin/check-devcontainer enforces this.
    ports:
      - "127.0.0.1:3000:3000"

    volumes:
    - ../../citewise:/workspaces/citewise:cached
    # read-only overlays on the workspace mount above
    - ../.claude:/workspaces/citewise/.claude:ro
    - ../.github:/workspaces/citewise/.github:ro
    - ../.devcontainer:/workspaces/citewise/.devcontainer:ro
    - ../.git/hooks:/workspaces/citewise/.git/hooks:ro
    - ../.git/config:/workspaces/citewise/.git/config:ro
    - ../CLAUDE.md:/workspaces/citewise/CLAUDE.md:ro

    # lets the firewall script (running as root through sudo) manage network rules
    cap_add:
    - NET_ADMIN
    - NET_RAW

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally for vscode.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    networks:
      - default
      - database

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    networks:
      - database

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

    secrets:
      - postgres_admin_password

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1
          -U citewise_app -d citewise_development
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:

networks:
  default: {}
  database:
    external: true
    name: citewise-db-private

secrets:
  postgres_admin_password:
    file: ${HOME}/.config/citewise/postgres-admin-password
