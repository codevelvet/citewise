default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  # Every job's queue must be listed here; test/config/queue_config_test.rb checks.
  workers:
    - queues: [ default, ingestion ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    # Must stay at one process and one thread: Embeddings::RateLimiter keeps
    # Voyage within its rate limits in-process only.
    - queues: embeddings
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
