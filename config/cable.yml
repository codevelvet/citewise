# Development uses Solid Cable, as production does: AskJob broadcasts from bin/jobs, and
# the async adapter only reaches its own process.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
